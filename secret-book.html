<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="robots" content="noindex,nofollow">
  <title>우리두리</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Apple SD Gothic Neo",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#f6f6f6}
    button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}
    [hidden]{display:none!important}
    #gate{min-height:100dvh;display:grid;place-items:center;color:#aaa;font-size:14px}
    .shell{max-width:1120px;margin:auto;padding:0 18px 80px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid #303030}
    .topbar a{color:#e5e5e5;text-decoration:none;font-size:15px}.topbar strong{font-size:15px;font-weight:550;letter-spacing:.04em}
    .topbar button,.toolbar button,.page-tools button,.block-actions button,.reader-head button,.reader-foot button{border:1px solid #5a5a5a;border-radius:10px;background:#161616;color:#fff;min-height:42px;padding:8px 12px}
    .intro{padding:27px 0 22px}.intro h1{font-size:clamp(25px,4vw,36px);font-weight:580;margin:0 0 9px}.intro p{color:#a9a9a9;font-size:14px;line-height:1.65;margin:0}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.toolbar button.primary{background:#fff;color:#111;border-color:#fff}
    #saveStatus{min-height:24px;margin:0 0 20px;color:#aaa;font-size:13px}
    .layout{display:grid;grid-template-columns:minmax(300px,410px) minmax(0,1fr);gap:24px;align-items:start}
    .edit-panel,.preview-panel{border:1px solid #333;border-radius:16px;background:#101010;padding:18px}
    .edit-panel label{display:block;font-size:13px;color:#bbb;margin-bottom:8px}
    .title-input{width:100%;border:1px solid #484848;border-radius:10px;padding:12px;background:#191919;color:#fff;font-size:18px}
    .page-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 15px}.page-tools span{font-size:14px;color:#ddd;margin:auto}
    .block{border:1px solid #343434;border-radius:12px;padding:13px;margin-bottom:12px;background:#181818}
    .block-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#bcbcbc;font-size:13px;margin-bottom:10px}
    .block-actions{display:flex;gap:5px}.block-actions button{min-height:31px;padding:4px 8px;font-size:13px}
    .block textarea{width:100%;min-height:120px;resize:vertical;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:8px;padding:12px;font-size:16px;line-height:1.5}
    .block input[type=range]{width:100%;accent-color:#eee;margin:12px 0 0}
    .page-font{margin:0 0 16px;padding:13px;border:1px solid #484848;border-radius:10px;background:#171717}
    .page-font label{display:flex;justify-content:space-between;color:#fff;margin:0 0 8px}
    .page-font input{width:100%;accent-color:#fff}
    .block img{display:block;width:100%;max-height:180px;object-fit:contain;background:#070707;border-radius:8px}
    .add-actions{display:flex;gap:8px;margin-top:16px}.add-actions button{flex:1;min-height:44px;background:#292929;color:#fff;border:1px solid #555;border-radius:10px}
    .hint{font-size:12px;line-height:1.6;color:#909090;margin:14px 0 0}
    .preview-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:14px}
    .spread-toggle{display:flex;gap:5px}.spread-toggle button{border:1px solid #555;border-radius:8px;background:#1b1b1b;color:#fff;padding:7px 10px;font-size:12px}.spread-toggle button.active{background:#fff;color:#111}
    .pages{display:flex;justify-content:center;align-items:center;gap:12px;touch-action:pan-y;user-select:none}
    .editable-pages{touch-action:none;cursor:grab}.editable-pages.is-dragging{cursor:grabbing}
    .pages canvas{display:block;width:100%;max-width:460px;height:auto;aspect-ratio:900/1273;box-shadow:0 10px 32px #000a;border:1px solid #282828}
    .pages.two canvas{width:calc(50% - 6px)}
    .empty-page{width:calc(50% - 6px);aspect-ratio:900/1273;border:1px dashed #383838}
    #overflowStatus{color:#f1adae;font-size:13px;min-height:24px;margin:12px 0}
    .preview-nav{display:flex;justify-content:space-between;gap:8px}.preview-nav button{min-height:42px;padding:8px 16px;border:1px solid #555;background:#191919;color:#fff;border-radius:9px}
    #reader{position:fixed;inset:0;background:#050505;z-index:50;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
    .reader-head,.reader-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;flex-wrap:wrap}
    .reader-head strong{font-size:14px;font-weight:500}.reader-pages{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
    .reader-pages canvas{max-height:calc(100dvh - 170px);width:auto;max-width:100%;object-fit:contain}
    .reader-pages.two canvas{max-width:calc(50% - 6px)}
    .reader-foot span{color:#aaa;font-size:13px}.reader-foot button{min-width:74px}
    @media(max-width:760px){.layout{display:flex;flex-direction:column}.preview-panel{order:0;width:100%}.edit-panel{order:1;width:100%}.shell{padding:0 14px 54px}.topbar{padding:12px 0}.reader-pages canvas{max-height:calc(100dvh - 190px)}}
  </style>
</head>
<body>
  <div id="gate">계정을 확인하고 있어요…</div>
  <div id="app" class="shell" hidden>
    <header class="topbar"><a href="./index.html">← 우리두리</a><strong>나만의 수첩</strong><button id="openReader" type="button">전체 화면 보기</button></header>
    <section class="intro"><h1>1주년을 위한 수첩</h1><p>지금 작성하는 내용은 이 기기에만 저장돼요. 세은의 화면에는 나타나지 않아요.</p></section>
    <div class="toolbar"><button id="exportPdf" class="primary" type="button">전체 PDF 저장</button><button id="exportPng" type="button">현재 화면 사진 저장</button><button id="backupDraft" type="button">편집용 백업</button><button id="restoreDraft" type="button">백업 불러오기</button><input id="restoreInput" type="file" accept="application/json,.json" hidden></div>
    <p id="saveStatus" role="status" aria-live="polite"></p>
    <div class="layout">
      <section class="edit-panel" aria-label="수첩 편집">
        <label for="bookTitle">수첩 제목</label><input id="bookTitle" class="title-input" maxlength="100" autocomplete="off">
        <div class="page-tools"><button id="previousPage" type="button" aria-label="이전 페이지">←</button><span id="pageCounter"></span><button id="nextPage" type="button" aria-label="다음 페이지">→</button><button id="addPage" type="button">＋ 페이지</button><button id="deletePage" type="button">삭제</button></div>
        <div class="page-font"><label for="pageFontSize">이 페이지 글씨 크기 <strong id="pageFontSizeValue">18</strong></label><input id="pageFontSize" type="range" min="12" max="32" step="1" value="18" aria-label="이 페이지 글씨 크기"></div>
        <div id="blocks"></div>
        <div class="add-actions"><button id="addText" type="button">＋ 글</button><button id="addPhoto" type="button">＋ 사진</button><input id="photoInput" type="file" accept="image/*" hidden></div>
        <p class="hint">미리보기의 사진을 손가락으로 끌어 원하는 자리에 놓으세요. 글은 사진을 피해 자동으로 줄바꿈돼요. 내용이 넘치면 새 페이지에 나눠 담아 주세요.</p>
      </section>
      <section class="preview-panel" aria-label="수첩 편집 미리보기"><div class="preview-head"><span>한 페이지 편집 · 사진을 끌어 움직여요</span></div><div id="previewPages" class="pages editable-pages"></div><p id="overflowStatus"></p><div class="preview-nav"><button id="previewPrevious" type="button">← 이전</button><button id="previewNext" type="button">다음 →</button></div></section>
    </div>
  </div>
  <div id="reader" hidden aria-label="수첩 전체 화면"><div class="reader-head"><button id="closeReader" type="button">닫기</button><strong id="readerTitle"></strong><div class="spread-toggle"><button data-spread="1" class="active" type="button">한 페이지</button><button data-spread="2" type="button">두 페이지</button></div></div><div id="readerPages" class="pages reader-pages"></div><div class="reader-foot"><button id="readerPrevious" type="button">← 이전</button><span id="readerCounter"></span><button id="readerNext" type="button">다음 →</button></div></div>
  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {emptyBook,normalizeBook,drawPage,pdfFromCanvases,PAGE_WIDTH,PAGE_HEIGHT} from "./secret-book-core.js";
    const $=id=>document.getElementById(id);
    const auth=getAuth(initializeApp({apiKey:"AIzaSyClSapSfkfkzoWMxHVlls1UjIRO4bHl1Fc",authDomain:"first-app-ffb0b.firebaseapp.com",projectId:"first-app-ffb0b",appId:"1:948722690899:web:bed5a4a4a43b618702cfa6"}));
    let book=emptyBook(),current=0,spread=1,db=null,draftKey="",dirty=0,saved=0,saving=false,saveTimer=0,previewTimer=0,previewToken=0,busy=false;
    const safeName=()=>book.title.trim().replace(/[\\/:*?"<>|]/g,"").slice(0,50)||"우리두리-1주년";
    function status(message){$("saveStatus").textContent=message;}
    function openDatabase(){
      return new Promise((resolve,reject)=>{
        const request=indexedDB.open("wooriduri-private-book-v1",1);
        request.onupgradeneeded=()=>request.result.createObjectStore("drafts");
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
      });
    }
    function dbGet(key){return new Promise((resolve,reject)=>{const request=db.transaction("drafts","readonly").objectStore("drafts").get(key);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
    function dbPut(key,value){return new Promise((resolve,reject)=>{const request=db.transaction("drafts","readwrite").objectStore("drafts").put(value,key);request.onsuccess=()=>resolve();request.onerror=()=>reject(request.error);});}
    function changed(){dirty++;status(db?"저장 중…":"기기 저장소를 열지 못했어요. PDF와 편집용 백업을 저장해 주세요.");clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,350);queuePreview();}
    async function saveDraft(){
      if(!db||saving||saved===dirty)return;
      saving=true;
      try{
        while(saved!==dirty){const version=dirty,snapshot=normalizeBook(book);await dbPut(draftKey,snapshot);saved=version;}
        status("이 기기에 저장했어요");
      }catch(error){status("기기에 저장하지 못했어요. PDF와 편집용 백업을 저장해 주세요.");console.error(error);}
      finally{saving=false;}
    }
    function queuePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(renderPreview,110);}
    function pageStart(){return spread===2?Math.floor(current/2)*2:current;}
    function visibleIndexes(){const start=pageStart();return spread===2?[start,start+1].filter(index=>index<book.pages.length):[start];}
    function syncSpreadButtons(){document.querySelectorAll("[data-spread]").forEach(button=>button.classList.toggle("active",Number(button.dataset.spread)===spread));}
    function updateCounters(){
      $("pageCounter").textContent=`${current+1} / ${book.pages.length} 페이지`;
      const visible=visibleIndexes();
      $("readerCounter").textContent=visible.length===2?`${visible[0]+1}–${visible[1]+1} / ${book.pages.length}`:`${visible[0]+1} / ${book.pages.length}`;
      $("previousPage").disabled=$("previewPrevious").disabled=current===0;
      $("nextPage").disabled=$("previewNext").disabled=current>=book.pages.length-1;
      $("readerPrevious").disabled=pageStart()===0;
      $("readerNext").disabled=pageStart()+(spread===2?2:1)>=book.pages.length;
      $("deletePage").disabled=book.pages.length===1;
    }
    function renderBlocks(){
      $("bookTitle").value=book.title;$("blocks").replaceChildren();
      const firstText=book.pages[current].blocks.find(block=>block.type==="text");
      $("pageFontSize").value=firstText?.size||18;$("pageFontSizeValue").textContent=String(firstText?.size||18);
      book.pages[current].blocks.forEach((block,index)=>{
        const card=document.createElement("div");card.className="block";
        const head=document.createElement("div");head.className="block-head";
        const name=document.createElement("span");name.textContent=block.type==="text"?"글":"사진";
        const actions=document.createElement("div");actions.className="block-actions";
        for(const [label,action] of [["↑","up"],["↓","down"],["×","remove"]]){
          const button=document.createElement("button");button.type="button";button.textContent=label;button.dataset.blockAction=action;button.dataset.index=index;button.setAttribute("aria-label",action==="remove"?"블록 삭제":action==="up"?"위로 이동":"아래로 이동");button.disabled=action==="up"&&index===0||action==="down"&&index===book.pages[current].blocks.length-1;actions.append(button);
        }
        head.append(name,actions);card.append(head);
        if(block.type==="text"){
          const area=document.createElement("textarea");area.value=block.text;area.maxLength=4000;area.placeholder="이 페이지에 남길 말을 적어 주세요";area.dataset.textIndex=index;area.setAttribute("aria-label","글 내용");
          const label=document.createElement("label");label.textContent=`글씨 크기 · ${block.size}`;
          const range=document.createElement("input");range.type="range";range.min="12";range.max="32";range.step="1";range.value=block.size;range.dataset.sizeIndex=index;
          card.append(area,label,range);
        }else{
          const image=document.createElement("img");image.src=block.data;image.alt="수첩에 넣은 사진";
          const label=document.createElement("label");label.textContent=`사진 크기 · ${Math.round(block.w||360)}`;
          const range=document.createElement("input");range.type="range";range.min="150";range.max="650";range.step="10";range.value=block.w||360;range.dataset.imageSizeIndex=index;
          card.append(image,label,range);
        }
        $("blocks").append(card);
      });
      updateCounters();queuePreview();
    }
    async function renderPreview(){
      const token=++previewToken;
      const result=await drawPage(book.pages[current],current+1,book.pages.length);
      if(token!==previewToken)return;
      $("previewPages").replaceChildren(result.canvas);
      $("previewPages").photoRects=result.photoRects;
      $("overflowStatus").textContent=result.overflow?`${current+1}페이지가 넘쳐요. 다음 페이지로 나눠 주세요.`:"";
      if(!$("reader").hidden)await renderReader(token);
      updateCounters();
    }
    async function renderReader(token){
      $("readerTitle").textContent=book.title;
      const canvases=[];
      for(const index of visibleIndexes()){const result=await drawPage(book.pages[index],index+1,book.pages.length);if(token!==previewToken)return;canvases.push(result.canvas);}
      $("readerPages").replaceChildren(...canvases);
      $("readerPages").classList.toggle("two",spread===2);
      if(spread===2&&canvases.length===1){const empty=document.createElement("div");empty.className="empty-page";$("readerPages").append(empty);}
    }
    function navigate(delta,reader=false){current=Math.max(0,Math.min(book.pages.length-1,(reader?pageStart():current)+delta*(reader&&spread===2?2:1)));renderBlocks();}
    function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
    async function withExport(task){if(busy)return;busy=true;for(const id of ["exportPdf","exportPng"])$(id).disabled=true;try{await task();}catch(error){status(error.message||"내보내지 못했어요.");}finally{busy=false;for(const id of ["exportPdf","exportPng"])$(id).disabled=false;}}
    async function exportPdf(){
      await withExport(async()=>{
        status("PDF 만드는 중…");const canvases=[];
        for(let index=0;index<book.pages.length;index++){const result=await drawPage(book.pages[index],index+1,book.pages.length);if(result.overflow)throw new Error(`${index+1}페이지 내용이 넘쳐요. 나눠 적은 뒤 저장해 주세요.`);canvases.push(result.canvas);}
        download(pdfFromCanvases(canvases),`${safeName()}.pdf`);status("PDF를 저장했어요.");
      });
    }
    async function exportPng(){
      await withExport(async()=>{
        status("사진 만드는 중…");const indexes=$("reader").hidden?[current]:visibleIndexes(),gap=indexes.length===2?22:0;
        const combined=document.createElement("canvas");combined.width=PAGE_WIDTH*indexes.length+gap;combined.height=PAGE_HEIGHT;
        const ctx=combined.getContext("2d");ctx.fillStyle="#050505";ctx.fillRect(0,0,combined.width,combined.height);
        for(let i=0;i<indexes.length;i++){const index=indexes[i],result=await drawPage(book.pages[index],index+1,book.pages.length);if(result.overflow)throw new Error(`${index+1}페이지 내용이 넘쳐요.`);ctx.drawImage(result.canvas,i*(PAGE_WIDTH+gap),0);}
        const blob=await new Promise(resolve=>combined.toBlob(resolve,"image/png"));
        if(!blob)throw new Error("사진을 만들지 못했어요.");download(blob,`${safeName()}-${indexes.map(i=>i+1).join("-")}페이지.png`);status("현재 화면 사진을 저장했어요.");
      });
    }
    function resizePhoto(file){
      return new Promise((resolve,reject)=>{
        if(!file?.type.startsWith("image/"))return reject(new Error("사진 파일을 골라 주세요."));
        const url=URL.createObjectURL(file),image=new Image();
        image.onload=()=>{
          try{const scale=Math.min(1,1400/image.width,1800/image.height),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));canvas.getContext("2d").drawImage(image,0,0,canvas.width,canvas.height);let data="",quality=.78;do{data=canvas.toDataURL("image/jpeg",quality);quality-=.12;}while(data.length>=2400000&&quality>=.3);if(data.length>=2400000)throw new Error("사진이 너무 커요. 더 작은 사진을 골라 주세요.");resolve(data);}
          catch(error){reject(error);}finally{URL.revokeObjectURL(url);}
        };
        image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("사진을 읽지 못했어요."));};
        image.src=url;
      });
    }
    function bind(){
      $("bookTitle").addEventListener("input",event=>{book.title=event.target.value;changed();});
      $("pageFontSize").addEventListener("input",event=>{const size=Number(event.target.value);$("pageFontSizeValue").textContent=String(size);book.pages[current].blocks.forEach(block=>{if(block.type==="text")block.size=size;});$("blocks").querySelectorAll("[data-size-index]").forEach(range=>{range.value=String(size);range.previousElementSibling.textContent=`글씨 크기 · ${size}`;});changed();});
      $("blocks").addEventListener("input",event=>{
        if(event.target.dataset.imageSizeIndex!==undefined){
          const photo=book.pages[current].blocks[Number(event.target.dataset.imageSizeIndex)];
          if(photo?.type!=="image")return;
          photo.w=Number(event.target.value);event.target.previousElementSibling.textContent=`사진 크기 · ${photo.w}`;changed();return;
        }
        const index=event.target.dataset.textIndex??event.target.dataset.sizeIndex;if(index===undefined)return;
        const block=book.pages[current].blocks[Number(index)];if(!block||block.type!=="text")return;
        if(event.target.dataset.textIndex!==undefined)block.text=event.target.value;
        else{block.size=Number(event.target.value);event.target.previousElementSibling.textContent=`글씨 크기 · ${block.size}`;if(book.pages[current].blocks.findIndex(item=>item.type==="text")===Number(index)){$("pageFontSize").value=String(block.size);$("pageFontSizeValue").textContent=String(block.size);}}
        changed();
      });
      $("blocks").addEventListener("click",event=>{
        const button=event.target.closest("[data-block-action]");if(!button)return;
        const blocks=book.pages[current].blocks,index=Number(button.dataset.index),action=button.dataset.blockAction;
        if(action==="remove")blocks.splice(index,1);
        else if(action==="up"&&index>0)[blocks[index-1],blocks[index]]=[blocks[index],blocks[index-1]];
        else if(action==="down"&&index<blocks.length-1)[blocks[index+1],blocks[index]]=[blocks[index],blocks[index+1]];
        changed();renderBlocks();
      });
      $("addText").onclick=()=>{if(book.pages[current].blocks.length>=80)return status("한 페이지에 글과 사진을 더 넣을 수 없어요.");book.pages[current].blocks.push({type:"text",text:"",size:Number($("pageFontSize").value)||18});changed();renderBlocks();$("blocks").lastElementChild?.querySelector("textarea")?.focus();};
      $("addPhoto").onclick=()=>$("photoInput").click();
      $("photoInput").onchange=async event=>{const file=event.target.files?.[0];event.target.value="";if(!file)return;if(book.pages[current].blocks.length>=80)return status("한 페이지에 글과 사진을 더 넣을 수 없어요.");try{status("사진 준비 중…");const data=await resizePhoto(file),count=book.pages[current].blocks.filter(block=>block.type==="image").length;book.pages[current].blocks.push({type:"image",data,x:450,y:Math.min(760,280+count*110),w:360});changed();renderBlocks();}catch(error){status(error.message||"사진을 넣지 못했어요.");}};
      $("previousPage").onclick=()=>{current--;renderBlocks();};$("nextPage").onclick=()=>{current++;renderBlocks();};
      $("addPage").onclick=()=>{if(book.pages.length>=40)return status("수첩은 최대 40페이지까지 만들 수 있어요.");book.pages.splice(current+1,0,{blocks:[]});current++;changed();renderBlocks();};
      $("deletePage").onclick=()=>{if(book.pages.length===1)return;if(book.pages[current].blocks.length&&!confirm("이 페이지를 삭제할까요?"))return;book.pages.splice(current,1);current=Math.min(current,book.pages.length-1);changed();renderBlocks();};
      $("previewPrevious").onclick=()=>navigate(-1);$("previewNext").onclick=()=>navigate(1);
      $("readerPrevious").onclick=()=>navigate(-1,true);$("readerNext").onclick=()=>navigate(1,true);
      document.querySelectorAll("[data-spread]").forEach(button=>button.onclick=()=>{spread=Number(button.dataset.spread);syncSpreadButtons();queuePreview();updateCounters();});
      $("openReader").onclick=()=>{$("reader").hidden=false;queuePreview();};
      $("closeReader").onclick=()=>$("reader").hidden=true;
      $("exportPdf").onclick=exportPdf;$("exportPng").onclick=exportPng;
      $("backupDraft").onclick=()=>download(new Blob([JSON.stringify(normalizeBook(book))],{type:"application/json"}),`${safeName()}-편집용.json`);
      $("restoreDraft").onclick=()=>$("restoreInput").click();
      $("restoreInput").onchange=async event=>{const file=event.target.files?.[0];event.target.value="";if(!file||!confirm("현재 수첩을 백업 파일로 바꿀까요?"))return;try{book=normalizeBook(JSON.parse(await file.text()));current=0;changed();renderBlocks();status("백업을 불러왔어요.");}catch{status("백업 파일을 읽지 못했어요.");}};
      const editor=$("previewPages");let drag=null;
      const pagePoint=event=>{const canvas=editor.querySelector("canvas");if(!canvas)return null;const rect=canvas.getBoundingClientRect();return {x:(event.clientX-rect.left)*PAGE_WIDTH/rect.width,y:(event.clientY-rect.top)*PAGE_HEIGHT/rect.height};};
      editor.addEventListener("pointerdown",event=>{
        const point=pagePoint(event);if(!point)return;
        const photo=[...(editor.photoRects||[])].reverse().find(rect=>point.x>=rect.x&&point.x<=rect.x+rect.w&&point.y>=rect.y&&point.y<=rect.y+rect.h);
        if(!photo)return;
        drag={pointerId:event.pointerId,index:photo.index,offsetX:point.x-photo.x,offsetY:point.y-photo.y,w:photo.w,h:photo.h};
        editor.setPointerCapture(event.pointerId);editor.classList.add("is-dragging");event.preventDefault();
      });
      editor.addEventListener("pointermove",event=>{
        if(!drag||event.pointerId!==drag.pointerId)return;
        const point=pagePoint(event),photo=book.pages[current].blocks[drag.index];if(!point||photo?.type!=="image")return;
        photo.x=Math.max(84,Math.min(PAGE_WIDTH-84-drag.w,point.x-drag.offsetX));
        photo.y=Math.max(100,Math.min(1160-drag.h,point.y-drag.offsetY));
        clearTimeout(previewTimer);previewTimer=setTimeout(renderPreview,16);
      });
      const finishDrag=event=>{if(!drag||event.pointerId!==drag.pointerId)return;drag=null;editor.classList.remove("is-dragging");if(editor.hasPointerCapture(event.pointerId))editor.releasePointerCapture(event.pointerId);changed();};
      editor.addEventListener("pointerup",finishDrag);editor.addEventListener("pointercancel",finishDrag);
      const area=$("readerPages");let startX=0,startY=0;
      area.addEventListener("touchstart",event=>{startX=event.changedTouches[0].clientX;startY=event.changedTouches[0].clientY;},{passive:true});
      area.addEventListener("touchend",event=>{const dx=event.changedTouches[0].clientX-startX,dy=event.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)navigate(dx>0?1:-1,true);},{passive:true});
      window.addEventListener("keydown",event=>{if($("reader").hidden)return;if(event.key==="Escape")$("reader").hidden=true;else if(event.key==="ArrowRight")navigate(1,true);else if(event.key==="ArrowLeft")navigate(-1,true);});
      document.addEventListener("visibilitychange",()=>{if(document.hidden)saveDraft();});
    }
    onAuthStateChanged(auth,async user=>{
      if(user?.email?.toLowerCase()!=="user1@wooriduri.app"){location.replace("./index.html");return;}
      draftKey=`anniversary-2026:${user.uid}`;
      try{db=await openDatabase();const savedBook=await dbGet(draftKey);if(savedBook)book=normalizeBook(savedBook);}
      catch(error){status("기기 저장소를 열지 못했어요. 편집용 백업을 꼭 저장해 주세요.");console.error(error);}
      $("gate").hidden=true;$("app").hidden=false;bind();renderBlocks();
    });
  </script>
</body>
</html>
